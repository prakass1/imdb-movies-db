# PostgreSQL with Adminer - docker-compose configuration
# Credentials: postgres / example
services:

  db:
    image: postgres:latest
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_USER: ${PGUSER}
      POSTGRESQL_DATABASE: postgres
    env_file:
      - .env
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db_data:/var/lib/pgsql/data

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - db

volumes:
  db_data:
